name: SEPA weekly capture

on:
  schedule:
    # GitHub Actions cron uses UTC; Argentina is UTC-3.
    - cron: "0 17 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sepa-weekly-${{ github.ref }}
  cancel-in-progress: false

jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      DB_MODE: postgres
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      CKAN_API_KEY: ${{ secrets.CKAN_API_KEY }}
      RUN_AT: "14:00"
      RUN_TIMEZONE: America/Argentina/Buenos_Aires

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Run tests
        run: python -m unittest discover -s tests -p "test_*.py"
        env:
          DB_MODE: sqlite

      - name: Restore selected branch state
        uses: actions/cache/restore@v4
        with:
          path: data/state/sucursales_seguidas.json
          key: sepa-branch-selection-${{ github.ref_name }}-${{ github.run_id }}
          restore-keys: |
            sepa-branch-selection-${{ github.ref_name }}-
  
      - name: Diagnose CKAN response
        run: |
          curl -sS -L \
            -D /tmp/ckan-headers.txt \
            -o /tmp/ckan-body.txt \
            -w "HTTP %{http_code}\n" \
            --get --data-urlencode "id=sepa-precios" \
            "https://datos.produccion.gob.ar/api/3/action/package_show"

          grep -iE '^(HTTP/|content-type:|server:|via:)' /tmp/ckan-headers.txt || true
          head -c 2000 /tmp/ckan-body.txt
          echo
      
      - name: Run weekly capture
        run: python -m sepa_bot.main --once

      - name: Save selected branch state
        if: always()
        uses: actions/cache/save@v4
        with:
          path: data/state/sucursales_seguidas.json
          key: sepa-branch-selection-${{ github.ref_name }}-${{ github.run_id }}

